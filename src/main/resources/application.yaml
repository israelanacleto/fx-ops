spring:
  application:
    name: fx-ops
  datasource:
    url: jdbc:h2:mem:fxops
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true


jwt:
  secret: ""
  expiration-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always